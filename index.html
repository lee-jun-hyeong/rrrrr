<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성민안경 - 실시간 AI 시각 분석</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts (Noto Sans KR) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; scroll-behavior: smooth; }
        .tab-content { display: none; }
        .tab-content.active { display: grid; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        #ai-chat-modal { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); transform: translateY(20px); opacity: 0; pointer-events: none; }
        #ai-chat-modal.active { transform: translateY(0); opacity: 1; pointer-events: auto; }
        .chat-bubble { border-radius: 18px; padding: 12px 16px; margin-bottom: 8px; max-width: 85%; font-size: 14px; line-height: 1.5; }
        .chat-ai { background-color: #f1f5f9; color: #1e293b; align-self: flex-start; border-bottom-left-radius: 2px; }
        .chat-user { background-color: #2563eb; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        
        /* 실시간 화면 캡처용 숨김 캔버스 */
        #hidden-canvas { display: none; }
        #screen-video { display: none; }

        .live-indicator { display: inline-flex; items-center; gap: 4px; color: #ef4444; font-size: 10px; font-weight: bold; }
        .dot { width: 6px; height: 6px; background: #ef4444; border-radius: 50%; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body class="bg-white text-slate-900">

    <!-- --- HEADER --- -->
    <header id="main-header" class="fixed w-full z-50 transition-all duration-300 py-5">
        <div class="container mx-auto px-6 flex justify-between items-center">
            <a href="#" class="text-2xl font-bold text-white transition-colors duration-300" id="logo">성민안경</a>
            <nav class="hidden md:flex space-x-10">
                <a href="#about" class="nav-link text-sm font-medium text-white/90 hover:text-blue-400">소개</a>
                <a href="#products" class="nav-link text-sm font-medium text-white/90 hover:text-blue-400">제품</a>
                <a href="#services" class="nav-link text-sm font-medium text-white/90 hover:text-blue-400">서비스</a>
            </nav>
            <button class="md:hidden text-white" id="menu-btn"><i data-lucide="menu"></i></button>
        </div>
    </header>

    <!-- --- HERO SECTION --- -->
    <section class="relative h-[85vh] flex items-center justify-center overflow-hidden">
        <div class="absolute inset-0 bg-slate-900">
            <img src="https://images.unsplash.com/photo-1493711662062-fa541adb3fc8?q=80&w=2070&auto=format&fit=crop" class="w-full h-full object-cover opacity-60" alt="안경 모델">
        </div>
        <div class="relative z-10 text-center px-6 max-w-4xl">
            <h1 class="text-4xl md:text-6xl font-black text-white leading-tight mb-8">당신의 화면을 실시간으로<br><span class="text-blue-400">이해하는 AI 상담사.</span></h1>
            <p class="text-lg text-white/90 mb-10">캡처할 필요 없이 화면 공유만으로 실시간 시각 문제를 진단받으세요.</p>
            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                <button onclick="startLiveConsulting()" class="bg-blue-600 text-white px-10 py-4 rounded-full font-bold hover:bg-blue-700 transition-all shadow-lg flex items-center gap-2 justify-center">
                    <i data-lucide="video" size="20"></i> 실시간 화면 분석 시작
                </button>
            </div>
        </div>
    </section>

    <!-- --- ✨ AI CHAT MODAL --- -->
    <div id="ai-chat-modal" class="fixed bottom-6 right-6 w-[400px] max-w-[95vw] h-[600px] bg-white shadow-2xl rounded-3xl border border-slate-200 z-[100] flex flex-col overflow-hidden">
        <div class="bg-slate-900 p-4 text-white flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div id="live-status" class="hidden live-indicator"><span class="dot"></span> LIVE</div>
                <div>
                    <h3 class="font-bold text-sm">✨ 성민 실시간 AI 분석가</h3>
                    <p class="text-[10px] text-white/60" id="status-text">화면 공유를 시작해 주세요</p>
                </div>
            </div>
            <button onclick="toggleAIChat()" class="hover:bg-white/10 p-1 rounded-lg transition-all"><i data-lucide="x" size="20"></i></button>
        </div>

        <div id="chat-history" class="flex-1 overflow-y-auto p-4 flex flex-col gap-2 bg-slate-50/50 text-sm">
            <div class="chat-bubble chat-ai">안녕하세요! '실시간 화면 분석 시작' 버튼을 눌러 화면을 공유해 주시면, 제가 화면 속의 텍스트나 문제를 실시간으로 보고 답변해 드릴 수 있습니다.</div>
        </div>

        <div class="p-4 bg-white border-t border-slate-100">
            <div class="flex gap-2 bg-slate-100 p-2 rounded-2xl items-center">
                <input type="text" id="ai-input" placeholder="보고 있는 화면에 대해 질문하세요..." class="bg-transparent border-none outline-none flex-1 px-2 text-sm">
                <button onclick="askGemini()" id="send-btn" class="bg-blue-600 text-white w-10 h-10 rounded-xl flex items-center justify-center hover:bg-blue-700 transition-all">
                    <i data-lucide="send" size="18"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- 숨겨진 요소: 실시간 스트림 처리를 위한 비디오와 캔버스 -->
    <video id="screen-video" autoplay playsinline></video>
    <canvas id="hidden-canvas"></canvas>

    <button onclick="toggleAIChat()" id="ai-trigger" class="fixed bottom-6 right-6 w-14 h-14 bg-blue-600 text-white rounded-full shadow-2xl z-[90] flex items-center justify-center hover:scale-110 transition-all">
        <i data-lucide="sparkles"></i>
    </button>

    <script>
        lucide.createIcons();
        const apiKey = ""; 
        let screenStream = null;
        const video = document.getElementById('screen-video');
        const canvas = document.getElementById('hidden-canvas');

        async function startLiveConsulting() {
            try {
                // 브라우저 화면 공유 요청
                screenStream = await navigator.mediaDevices.getDisplayMedia({
                    video: { cursor: "always" },
                    audio: false
                });
                
                video.srcObject = screenStream;
                toggleAIChat(true);
                
                document.getElementById('live-status').classList.remove('hidden');
                document.getElementById('status-text').textContent = "화면 분석 준비 완료";
                
                // 스트림 종료 시 처리
                screenStream.getVideoTracks()[0].onended = () => {
                    stopLiveConsulting();
                };
            } catch (err) {
                console.error("Error: " + err);
                toggleAIChat(true);
                const history = document.getElementById('chat-history');
                const errorMsg = document.createElement('div');
                errorMsg.className = 'chat-bubble chat-ai text-red-500 text-xs';
                
                if (err.name === 'NotAllowedError' || err.message.includes('permissions policy')) {
                    errorMsg.innerHTML = "⚠️ <b>미리보기 환경 제한</b><br>현재 환경에서는 브라우저 보안 정책상 화면 공유가 차단되어 있습니다.<br><br>기능을 테스트하시려면 우측 상단의 코드 복사 버튼을 눌러 코드를 복사한 뒤, <b>index.html 파일로 저장하여 크롬 브라우저 등에서 직접 실행</b>해 주세요.";
                } else {
                    errorMsg.innerHTML = "⚠️ 화면 공유 권한이 필요합니다. 브라우저 권한을 허용해 주세요.";
                }
                
                history.appendChild(errorMsg);
                history.scrollTop = history.scrollHeight;
            }
        }

        function stopLiveConsulting() {
            if (screenStream) {
                screenStream.getTracks().forEach(track => track.stop());
                screenStream = null;
            }
            document.getElementById('live-status').classList.add('hidden');
            document.getElementById('status-text').textContent = "화면 공유 중단됨";
        }

        function captureScreen() {
            if (!screenStream) return null;
            
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Base64 데이터 추출
            return canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
        }

        async function askGemini() {
            const inputField = document.getElementById('ai-input');
            const history = document.getElementById('chat-history');
            const userText = inputField.value.trim();
            const sendBtn = document.getElementById('send-btn');

            if (!userText && !screenStream) {
                alert("질문을 입력하거나 화면 공유를 먼저 시작해주세요.");
                return;
            }

            // 메시지 추가
            const userMsg = document.createElement('div');
            userMsg.className = 'chat-bubble chat-user';
            userMsg.textContent = userText || "현재 화면 분석해줘.";
            history.appendChild(userMsg);
            
            // 현재 화면 캡처 (실시간성 확보)
            const currentFrame = captureScreen();
            
            inputField.value = '';
            history.scrollTop = history.scrollHeight;
            sendBtn.disabled = true;

            const loadingMsg = document.createElement('div');
            loadingMsg.className = 'chat-bubble chat-ai italic opacity-60';
            loadingMsg.textContent = '✨ 실시간 화면 분석 중...';
            history.appendChild(loadingMsg);

            try {
                let parts = [{ text: userText || "현재 화면의 텍스트를 읽고 질문에 답해줘." }];
                if (currentFrame) {
                    parts.push({
                        inlineData: {
                            mimeType: "image/jpeg",
                            data: currentFrame
                        }
                    });
                }

                const response = await fetchWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: parts }],
                        systemInstruction: {
                            parts: [{ text: "당신은 성민안경의 AI 시각 분석가입니다. 사용자가 공유한 실시간 화면 이미지를 보고, 이미지 속에 있는 문제, 텍스트, 처방전 등을 분석하여 답변하십시오. 사용자가 질문한 내용에 대해 화면의 정보를 근거로 정확한 답을 제시하십시오. 모든 답변은 한국어로 친절하게 작성하십시오." }]
                        }
                    })
                });

                const data = await response.json();
                const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || "분석 결과가 없습니다.";

                history.removeChild(loadingMsg);
                const aiMsg = document.createElement('div');
                aiMsg.className = 'chat-bubble chat-ai';
                aiMsg.innerHTML = aiText.replace(/\n/g, '<br>');
                history.appendChild(aiMsg);
            } catch (error) {
                history.removeChild(loadingMsg);
                console.error(error);
            } finally {
                sendBtn.disabled = false;
                history.scrollTop = history.scrollHeight;
            }
        }

        async function fetchWithRetry(url, options, retries = 5, backoff = 1000) {
            try {
                const res = await fetch(url, options);
                if (!res.ok) throw new Error('API Error');
                return res;
            } catch (err) {
                if (retries <= 0) throw err;
                await new Promise(r => setTimeout(r, backoff));
                return fetchWithRetry(url, options, retries - 1, backoff * 2);
            }
        }

        function toggleAIChat(forceOpen = false) {
            const modal = document.getElementById('ai-chat-modal');
            const trigger = document.getElementById('ai-trigger');
            if (forceOpen) modal.classList.add('active');
            else modal.classList.toggle('active');
            trigger.style.display = modal.classList.contains('active') ? 'none' : 'flex';
        }

        document.getElementById('ai-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') askGemini();
        });
    </script>
</body>
</html>
